// =============================================================================
//  Counter-Strike 2 - Practice Configuration
//  Version 2.0 (CS2 port of the CS:GO practice config)
//
//  Install : Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\practice.cfg
//  Run     : start a private match / offline map, open the console, type   exec practice
// =============================================================================


// -----------------------------------------------------------------------------
//  Cheats - must come FIRST, everything below depends on it
// -----------------------------------------------------------------------------
    sv_cheats                               1;


// -----------------------------------------------------------------------------
//  Player
// -----------------------------------------------------------------------------
    buddha                                  1;     // you take damage but never die (CS2 replacement for "god")
    cl_showpos                              1;     // show position / angle / velocity in the corner


// -----------------------------------------------------------------------------
//  Practice tools
// -----------------------------------------------------------------------------
    sv_grenade_trajectory_prac_pipreview    1;     // picture-in-picture camera that follows your grenade
    sv_grenade_trajectory_prac_trailtime    8;     // seconds the flight path stays drawn (8 = max)
    sv_showimpacts                          1;     // show bullet impacts (red = server, blue = client)
    sv_showimpacts_time                     10;


// -----------------------------------------------------------------------------
//  Binds  (note: these replace whatever you had on mouse4 / mouse5)
// -----------------------------------------------------------------------------
    bind "mouse4"                           "noclip";
    bind "mouse5"                           "sv_rethrow_last_grenade";


// -----------------------------------------------------------------------------
//  Aliases
// -----------------------------------------------------------------------------
    alias nades         "give weapon_hegrenade; give weapon_flashbang; give weapon_smokegrenade; give weapon_incgrenade; give weapon_molotov; give weapon_decoy";
    alias rethrow       "sv_rethrow_last_grenade";
    alias showray       "cast_ray";

//  Bots
    alias terrorist     "bot_add_t";
    alias counter       "bot_add_ct";
    alias place         "bot_place";
    alias kickbots      "bot_quota 0; bot_kick";

//  Bot toggles  (type once for ON, again for OFF)
    alias freeze        "freeze_on";
    alias freeze_on     "bot_stop 1; alias freeze freeze_off; echo [practice] Bots frozen";
    alias freeze_off    "bot_stop 0; alias freeze freeze_on; echo [practice] Bots unfrozen";

    alias mimic         "mimic_on";
    alias mimic_on      "bot_mimic 1; alias mimic mimic_off; echo [practice] Bot mimic ON";
    alias mimic_off     "bot_mimic 0; alias mimic mimic_on; echo [practice] Bot mimic OFF";


// -----------------------------------------------------------------------------
//  Server settings
// -----------------------------------------------------------------------------
    mp_limitteams                           0;
    mp_autoteambalance                      0;
    mp_roundtime                            60;
    mp_roundtime_defuse                     60;
    mp_roundtime_hostage                    60;
    mp_maxmoney                             60000;
    mp_startmoney                           60000;
    mp_freezetime                           0;
    mp_buytime                              9999;
    mp_buy_anywhere                         1;
    sv_infinite_ammo                        1;
    ammo_grenade_limit_total                5;
    bot_quota                               0;
    bot_kick;
    mp_warmup_end;
    mp_restartgame                          1;


echo " ";
echo "  +------------------------------------------------------+";
echo "  |  Counter-Strike 2 - Practice Configuration   v2.0    |";
echo "  +------------------------------------------------------+";
echo "  |  mouse4      noclip                                  |";
echo "  |  mouse5      rethrow last grenade                    |";
echo "  |                                                      |";
echo "  |  nades       give every grenade                      |";
echo "  |  rethrow     rethrow last grenade                    |";
echo "  |  showray     draw a ray where you are looking        |";
echo "  |                                                      |";
echo "  |  terrorist   add a T bot       counter   add a CT bot|";
echo "  |  place       place a bot where you look              |";
echo "  |  freeze      freeze / unfreeze bots                  |";
echo "  |  mimic       bots copy your movement (toggle)        |";
echo "  |  kickbots    remove all bots                         |";
echo "  +------------------------------------------------------+";
echo " ";
